# Public site — golazo26.onwike.workers.dev
# ASSETS-ONLY BY DESIGN: no `main`, no fetch handler, no secrets, no
# run_worker_first. Static asset requests are free, unlimited, and exempt from
# the account-wide 100k req/day cap — this file is the structural guarantee
# that a viral day cannot take the site down or cost money. Never add a
# fetch handler here (see docs/deployment-guide.md).
name = "golazo26"
compatibility_date = "2026-06-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"  # set to your own Cloudflare account id

[assets]
directory = "./dist"
not_found_handling = "404-page"
